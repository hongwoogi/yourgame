<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>yourga.me — 준비 중</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111310; color: #e9ede4; }
      main { width: min(680px, 90vw); padding: 64px 0; }
      .label { color: #badb82; font-size: 13px; letter-spacing: .12em; }
      h1 { font-size: clamp(48px, 8vw, 88px); letter-spacing: -.06em; margin: 24px 0; }
      p { color: #adb5a6; font-size: 17px; line-height: 1.8; }
      .status { margin-top: 48px; padding-top: 24px; border-top: 1px solid #343a2f; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <span class="label">A GAME WE MAKE TOGETHER</span>
      <h1>yourga.me</h1>
      <p>여러 사람의 제안으로 조금씩 달라지는 하나의 게임.<br>지금은 그 실험을 준비하고 있습니다.</p>
      <p class="status">서비스 연결 확인 중 · 게임 공개와 제안 모집은 아직 시작하지 않았습니다.</p>
    </main>
  </body>
</html>
